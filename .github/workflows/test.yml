name: test

on:
  push:
  pull_request:

jobs:
  grok:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run validate-data
      - run: npm run build
