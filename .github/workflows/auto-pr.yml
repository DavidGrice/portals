name: auto-pr

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or refresh PR from next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin portals-grok:portals-grok || true
          if ! git rev-parse --verify origin/next >/dev/null 2>&1; then
            echo "No origin/next branch yet."
            exit 0
          fi
          AHEAD=$(git rev-list --count origin/portals-grok..origin/next || echo 0)
          if [ "$AHEAD" = "0" ]; then
            echo "next is not ahead of portals-grok."
            exit 0
          fi
          EXISTING=$(gh pr list --base portals-grok --head next --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base portals-grok \
              --head next \
              --title "Integrate next into portals-grok" \
              --body "Opened by auto-pr.yml. CI must pass before merge."
            EXISTING=$(gh pr list --base portals-grok --head next --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$EXISTING" --squash --auto
          echo "PR #$EXISTING set to auto-merge when quality is green."
