name: ci

on:
  push:
    branches: [portals-grok, main]
  pull_request:
    branches: [portals-grok, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: grok/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run validate-data
      - run: npm run build
