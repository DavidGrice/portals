<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portals</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="welcome" class="welcome">
      <div class="welcome-aurora" aria-hidden="true"></div>
      <div class="welcome-motes" aria-hidden="true"></div>
      <header class="welcome-plaque">
        <h1>Portals</h1>
        <div class="welcome-rule">
          <span></span>
          <em>through the glass</em>
          <span></span>
        </div>
      </header>
      <div class="welcome-card" id="welcome-home">
        <button type="button" id="welcome-enter" class="welcome-enter">Enter</button>
        <button type="button" id="welcome-options" class="welcome-enter welcome-enter-ghost">Options</button>
        <p class="welcome-hint">WASD to move · Space to jump · mouse to look</p>
        <p id="welcome-gpu" class="welcome-gpu"></p>
      </div>
      <form id="options" class="welcome-card options" hidden>
        <h2>Graphics</h2>
        <label>Profile
          <select id="opt-profile">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="ultra">Ultra</option>
          </select>
        </label>
        <label>Field of view
          <input id="opt-fov" type="range" min="50" max="90" step="1" />
          <span id="opt-fov-value"></span>
        </label>
        <label>Portal recursion
          <input id="opt-recursion" type="range" min="1" max="4" step="1" />
          <span id="opt-recursion-value"></span>
        </label>
        <label>Render scale
          <select id="opt-scale">
            <option value="0.75">75%</option>
            <option value="1">100%</option>
            <option value="device">Device</option>
          </select>
        </label>
        <label class="options-check"><input id="opt-aa" type="checkbox" /> Anti-aliasing (reloads)</label>
        <label class="options-check"><input id="opt-shadows" type="checkbox" /> Shadows</label>
        <div class="options-actions">
          <button type="submit" class="welcome-enter">Apply</button>
          <button type="button" id="options-back" class="welcome-enter welcome-enter-ghost">Back</button>
        </div>
      </form>
    </div>
    <div id="crosshair" aria-hidden="true"></div>
    <aside id="debug" class="debug" hidden></aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
